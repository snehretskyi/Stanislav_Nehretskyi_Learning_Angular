<mat-card *ngIf="comment" routerLinkActive="active" >
  <mat-card-header>
    <img ngSrc="{{comment.author.profileImageURL}}" width="50" height="50" alt="" mat-card-avatar>
    <mat-card-title>{{comment.author.nickname | titlecase}}</mat-card-title>>
  </mat-card-header>
  <mat-card-content>{{comment.body | commentPunctuation}}</mat-card-content>
  <mat-card-footer>
    <div>{{comment.likes}} likes</div>
    <p class="comment-date">Created at: {{comment.commentDate | date:"short"}}</p>
  </mat-card-footer>
  <p *ngIf="comment.tip" id="tip">The comment has been tipped with {{comment.tip | currency}}</p>
  <div class="editButtons">
    <button [routerLink]="['/modify-comment',comment.id ]" mat-flat-button color="primary">Edit <mat-icon>edit_square</mat-icon></button>
    <button (click)="onDelete()" mat-flat-button color="primary">Delete <mat-icon>delete</mat-icon></button>
  </div>

</mat-card>
