<form [formGroup]="commentForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="author">Author</label>
    <input type="text" id="author" formControlName="author" />
  </div>


  <div class="form-group">
    <label for="nickname">Nickname</label>
    <input type="text" id="nickname" formControlName="nickname" />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" />
  </div>

  <div class="form-group">
    <label for="imageUrl">Image URL</label>
    <input type="text" id="imageUrl" formControlName="imageUrl" />
  </div>

  <button type="submit">Submit</button>

  <button type="button" (click)="onDelete()">Delete</button>

  <button type="button" (click)="navigateToCommentsList()">Back to List</button>
</form>
